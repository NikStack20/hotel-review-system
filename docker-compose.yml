services:


  # Infrastructure

  mysql:
    image: mysql:8.0
    container_name: hrs-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${USER_DB_NAME:-userservice}
      MYSQL_ROOT_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hrs-network

  postgres:
    image: postgres:18
    container_name: hrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HOTEL_DB_NAME:-hotelDB}
      POSTGRES_USER: ${HOTEL_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hrs-network

  mongodb:
    image: mongo:8
    container_name: hrs-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hrs-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: hrs-zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - hrs-network


  # Platform Services

  service-registry:
    build:
      context: ./service-registry
    container_name: hrs-service-registry
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: service-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - hrs-network

  config-server:
    build:
      context: ./config-server
    container_name: hrs-config-server
    restart: unless-stopped
    environment:
      CONFIG_REPO_URI: ${CONFIG_REPO_URI}
      CONFIG_REPO_BRANCH: ${CONFIG_REPO_BRANCH:-main}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
    ports:
      - "7054:7054"
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7054/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - hrs-network


  # Business Services

  user-service:
    build:
      context: ./user-service
    container_name: hrs-user-service
    restart: unless-stopped
    environment:
      USER_DB_URL: jdbc:mysql://mysql:3306/${USER_DB_NAME:-userservice}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:7054
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - hrs-network

  hotel-service:
    build:
      context: ./hotel-service
    container_name: hrs-hotel-service
    restart: unless-stopped
    environment:
      HOTEL_DB_URL: jdbc:postgresql://postgres:5432/${HOTEL_DB_NAME:-hotelDB}
      HOTEL_DB_USERNAME: ${HOTEL_DB_USERNAME}
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:7054
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - hrs-network

  rating-service:
    build:
      context: ./rating-service
    container_name: hrs-rating-service
    restart: unless-stopped
    environment:
      RATING_DB_URI: mongodb://mongodb:27017/${RATING_DB_NAME:-ratingService}
      CONFIG_SERVER_URL: http://config-server:7054
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - hrs-network


  # API Gateway

  api-gateway:
    build:
      context: ./api-gateway
    container_name: hrs-api-gateway
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:7054
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET}
      OKTA_REDIRECT_URI: ${OKTA_REDIRECT_URI:-http://localhost:7053/login/oauth2/code/okta}
    ports:
      - "7053:7053"
    depends_on:
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
      hotel-service:
        condition: service_started
      rating-service:
        condition: service_started
    networks:
      - hrs-network

networks:
  hrs-network:
    name: hrs-network
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  mongo_data:

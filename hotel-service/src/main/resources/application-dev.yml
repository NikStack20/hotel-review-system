spring:
  datasource:
    url: ${HOTEL_DB_URL}
    username: ${HOTEL_DB_USERNAME}
    password: ${HOTEL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}